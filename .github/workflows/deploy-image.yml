# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Build Docker image (publication disabled pending protected release gate)

on:
  push:
    branches: ['master']
  create:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE: zhayujie/chatgpt-on-wechat

jobs:
  build-image:
    if: github.repository == 'zhayujie/SmartAssistant'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        if: ${{ false }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        if: ${{ false }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract build metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            zhayujie/chatgpt-on-wechat
            zhayujie/smart_assistant
            ${{ env.REGISTRY }}/zhayujie/chatgpt-on-wechat
            ${{ env.REGISTRY }}/zhayujie/smart_assistant
          tags: |
            type=sha

      - name: Build Docker image without publishing
        uses: docker/build-push-action@v3
        with:
          context: .
          push: false
          file: ./docker/Dockerfile.latest
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - if: ${{ false }}
        uses: actions/delete-package-versions@v4
        with:
          package-name: 'chatgpt-on-wechat'
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
